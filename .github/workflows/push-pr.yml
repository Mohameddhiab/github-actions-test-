on:
    push:
        branches:
            - main 
            - "release/**"
        paths:
            - "src/**"
    pull_request:
        branches:
            - main
        paths:
            - "src/**"
jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4.2.2
            - name: setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: install dependencies
              run: npm ci
            - name: build
              run: npm run build
            - name: run tests
              run: npm test 